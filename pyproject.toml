[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeneuro"
version = "0.4.0"
description = "Cognitive Context & Scoped Rules Engine for Autonomous Coding Agents with Multi-Worktree support, WebUI & MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2,<0.143",
    "uvicorn[standard]>=0.54.0,<0.55",
    "pydantic>=2.13.5,<3",
    "mcp>=2.3.0,<3",
    "httpx>=0.28.1,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
codeneuro = "codeneuro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeneuro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
