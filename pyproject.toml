[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeneuro"
version = "0.1.0"
description = "Cognitive Context & Scoped Rules Engine for Autonomous Coding Agents with Multi-Worktree support, WebUI & MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
codeneuro = "codeneuro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeneuro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
