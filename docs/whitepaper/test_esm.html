<!DOCTYPE html>
<html>
<head>
</head>
<body>
<div id="check">PENDING</div>
<div id="svg-container"></div>
<script type="module">
  import mermaid from './mermaid.esm.min.mjs';
  window.mermaid = mermaid;
  mermaid.initialize({ startOnLoad: false, theme: 'dark' });
  try {
    const { svg } = await mermaid.render('test_svg', 'flowchart TD
  A --> B');
    document.getElementById('svg-container').innerHTML = svg;
    document.getElementById('check').textContent = 'SUCCESS_RENDERED_SVG_LENGTH_' + svg.length;
  } catch(e) {
    document.getElementById('check').textContent = 'ERROR_' + e.message;
  }
</script>
</body>
</html>
