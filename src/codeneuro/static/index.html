<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>CodeNeuro · Context workbench</title><link rel="stylesheet" href="/static/app.css"></head>
<body>
<a class="skip-link" href="#content">跳至工作台内容</a>
<aside class="sidebar"><a class="brand" href="/" aria-label="CodeNeuro 首页"><span class="brand-mark">C</span><span>CodeNeuro<small>CONTEXT WORKBENCH</small></span></a><label class="caption" for="project">PROJECT / 当前项目</label><select id="project" aria-label="当前项目"></select><button id="new-project" class="subtle">＋ 注册项目</button><nav id="navigation" aria-label="工作台导航"></nav><div class="aside-foot"><button id="open-palette" class="palette-trigger">搜索与命令 <kbd>Ctrl K</kbd></button><span id="health" role="status">正在连接服务…</span><span id="live-status" role="status">实时流等待连接</span><p>每一条规则，都能追溯到证据。</p></div></aside>
<main><header><div><div class="caption" id="breadcrumb">项目 / 工作台</div><h1 id="title">代码与上下文</h1><p id="subtitle"></p></div><div class="header-actions"><button id="export">导出规则</button><button id="refresh" aria-label="刷新当前视图">刷新</button></div></header><div id="metrics" class="metrics"></div><div id="notice" role="status" aria-live="polite"></div><button id="live-update" class="live-update" hidden>收到新事件，更新当前视图</button><section id="content" aria-label="工作区内容" tabindex="-1"></section></main>
<dialog id="editor"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close-editor" aria-label="关闭编辑器">×</button></div><div id="editor-fields"></div><div id="editor-error" role="alert"></div><footer><button type="button" id="cancel-editor">取消</button><button class="primary" type="submit">保存</button></footer></form></dialog>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close-detail" aria-label="关闭详情">×</button></div><div id="detail-content"></div></dialog>
<dialog id="palette" aria-label="搜索与命令"><div class="palette-search"><span aria-hidden="true">⌕</span><input id="palette-input" placeholder="搜索页面、任务、规则或文件…" aria-label="搜索命令" autocomplete="off"><kbd>Esc</kbd></div><div id="palette-results" role="listbox" aria-label="命令结果"></div><div class="palette-footer">↑ ↓ 选择 · Enter 打开 · Ctrl / ⌘ K 随时搜索</div></dialog>
<script src="/static/app.js" defer></script>
</body></html>
