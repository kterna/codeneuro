<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeNeuro · Context workspace</title><link rel="stylesheet" href="/static/app.css"></head>
<body>
<aside><a class="brand" href="/">Code<span>Neuro</span><small>CONTEXT WORKSPACE</small></a><label class="caption" for="project">当前项目</label><select id="project"></select><button id="new-project" class="subtle">＋ 注册项目</button><nav id="navigation"></nav><div class="aside-foot"><span id="health" role="status">正在连接服务…</span><p>规则有范围，变更有来源。</p></div></aside>
<main><header><div><div class="caption" id="breadcrumb">项目 / 规则</div><h1 id="title">规则</h1><p id="subtitle"></p></div><button id="refresh">刷新</button></header><div id="metrics" class="metrics"></div><div id="notice" role="status" aria-live="polite"></div><section id="content" aria-label="工作区内容"></section></main>
<dialog id="editor"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close-editor" aria-label="关闭">×</button></div><div id="editor-fields"></div><div id="editor-error" role="alert"></div><footer><button type="button" id="cancel-editor">取消</button><button class="primary" type="submit">保存</button></footer></form></dialog>
<script src="/static/app.js" defer></script>
</body></html>
